port 6379
bind 0.0.0.0
protected-mode no
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
# Advertise Docker DNS names (set per node via --cluster-announce-hostname)
# instead of container IPs, so clients resolve nodes by service name.
cluster-preferred-endpoint-type hostname
appendonly no
save ""
maxclients 10000
