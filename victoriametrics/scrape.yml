global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # One redis_exporter scrapes every cluster node via its multi-target /scrape endpoint.
  - job_name: redis_cluster
    metrics_path: /scrape
    static_configs:
      - targets:
          - redis://redis-node-1:6379
          - redis://redis-node-2:6379
          - redis://redis-node-3:6379
          - redis://redis-node-4:6379
          - redis://redis-node-5:6379
          - redis://redis-node-6:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: redis://([^:]+):\d+
        target_label: instance
        replacement: $1
      - target_label: __address__
        replacement: redis-exporter:9121

  # The exporter's own metrics.
  - job_name: redis_exporter
    static_configs:
      - targets: [redis-exporter:9121]
